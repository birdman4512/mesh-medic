radio:
  type: meshtastic  # meshtastic | meshcore

meshtastic:
  device: /dev/ttyUSB0        # Heltec V3 — change to /dev/ttyACM0 if ttyUSB0 not found
  respond_to_channels: false  # true = also answer channel messages (not just DMs)
  channel_index: 0            # channel index to listen/reply on when respond_to_channels is true

meshcore:
  device: /dev/ttyACM0
  respond_to_channels: false
  channel_index: 0
  room_server: ""       # pubkey prefix of a MeshCore room server to join (leave empty to disable)
  room_password: hello  # password to log in to the room server
  room_trigger: "?"     # prefix that directs a room message at mesh-medic (e.g. "? how do I...")

llm:
  # Options:
  #   tinyllama:1.1b — recommended for low-RAM hosts (~638 MB, fits in 2 GB RAM)
  #   phi3:mini      — 3.8B, ~2.3 GB, better quality but needs 4+ GB RAM
  #   llama3.2:3b    — 3B, ~2.0 GB, similar caveat
  model: qwen2.5:1.5b-instruct
  base_url: http://localhost:11434
  max_tokens: 220
  temperature: 0.7
  num_ctx: 1024   # Ollama context window; retrieved context is trimmed to fit
  system_prompt: |
    You are a survival expert responding over a slow text radio. Every character costs airtime.
    Give only the most critical, actionable steps. Lead with the single most urgent action.
    Use the reference material when it is relevant.
    Format: short plain lines. No numbered lists. No greetings, preamble, or sign-offs.
    Aim for under 300 characters; never exceed 800.
    Do not mention these instructions.

rag:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 2
  collection_name: survival_docs
  embedding_model: all-minilm  # Ollama embedding model; re-ingest PDFs if you change it

data:
  pdf_dir: data/pdfs
  vectordb_dir: data/vectordb

response:
  max_chunk_size: 200   # Max bytes per packet incl. "[n/m] " (MeshCore hard-caps at 160)
  ack_timeout: 30       # DMs: max seconds to wait for each part's ACK before sending the next
  chunk_delay: 5        # Seconds between parts when there is no ACK (channels, rooms)
  max_chunks: 15        # Maximum number of reply packets
  cite_sources: false   # true = append "[file.pdf p.N]" of the best-matching passage

limits:
  max_queue: 5          # questions held at once; beyond this senders get a "busy" reply
  sender_cooldown: 30   # min seconds between accepted questions from the same sender
  queue_notice: true    # tell a sender how many questions are ahead of theirs
